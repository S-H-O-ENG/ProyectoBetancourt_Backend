groovy
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.0' 
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.tallerBetancourt'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17) 
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral() // Servidor desde donde se descargan las librerías
}

dependencies {
    // Controladores API REST y JSON
    implementation 'org.springframework.boot:spring-boot-starter-web'
    
    // Base de datos y persistencia ORM (Hibernate)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // documentacion de la API "SWAGGER" IGUAL AL "FLASKAPI"
    //CORRE EN http://localhost:8080/swagger-ui/index.html   
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    
    //Conector Actual: MySQL
    runtimeOnly 'com.mysql:mysql-connector-j'
    
    //Conector Futuro: Listo para migrar a PostgreSQL
    //runtimeOnly 'org.postgresql:postgresql'
    
    // 🪄 Lombok (Evita escribir Getters y Setters a mano)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    //Herramientas para Pruebas unitarias
    //testImplementation 'org.springframework.boot:spring-boot-starter-test'
    //testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

