
# Nombre de la aplicación Spring Boot
spring.application.name=backend

# =====================================================
# CONFIGURACIÓN DE CONEXIÓN A LA BASE DE DATOS
# =====================================================

# Dirección de conexión a PostgreSQL.
# Indica el servidor, el puerto y el nombre de la base de datos.
spring.datasource.url=jdbc:postgresql://localhost:5432/TallerBetancourt

# Usuario utilizado para conectarse a PostgreSQL.
spring.datasource.username=postgres

# Contraseña del usuario de PostgreSQL.
# IMPORTANTE: No publicar esta contraseña en GitHub.
spring.datasource.password=${DB_PASSWORD:CAMBIAR_CONTRASENA}

# Controlador JDBC encargado de establecer la conexión con PostgreSQL.
spring.datasource.driver-class-name=org.postgresql.Driver


# =====================================================
# CONFIGURACIÓN DE JPA E HIBERNATE
# =====================================================

# Actualiza la estructura de las tablas según las entidades Java.
# No elimina las tablas ni sus datos existentes.
spring.jpa.hibernate.ddl-auto=update

# Muestra en la consola las consultas SQL ejecutadas por Hibernate.
spring.jpa.show-sql=true

# Formatea las consultas SQL para facilitar su lectura.
spring.jpa.properties.hibernate.format_sql=true

# Indica a Hibernate que utilice el dialecto de PostgreSQL.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# =====================================================
# CONFIGURACIÓN DEL JWT
# =====================================================

# Clave secreta codificada en Base64 para firmar los tokens JWT.
# Debe reemplazarse por una clave segura y mantenerse privada.
app.jwt.secret=${JWT_SECRET}

# Tiempo de duración del token: 30 minutos expresados en milisegundos.
app.jwt.expiration=1800000


# =====================================================
# CONFIGURACIÓN DEL SERVIDOR
# =====================================================

# Puerto en el que se ejecutará el backend.
server.port=8080

