spring.application.name=backend

#configuracion para conectarse a la bd
# linea 4 = es la direccion exacta de la bd, es la que hace la conexion de java y ls bd
spring.datasource.url=jdbc:postgresql://ep-little-art-bbr4xc1x.c-15.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
# linea 5 = es el usuario de la bd
spring.datasource.username=neondb_owner
# linea 6 = es la contraseña de la bd
spring.datasource.password=${DB_PASSWORD}

#configuracion para que JPA cree las tablas de la bd
# linea 13 = esta linea es para la creacion de las tablas en la bd, de forma intelginte, osea solo si no exite,y si ya existen no hace nada
spring.jpa.hibernate.ddl-auto=update
# linea 15 = es una herramienta para que java imprima en la consola todas las ordennes que le da a sql en tiempo real
spring.jpa.show-sql=true
# linea 16 = es la que determina que sintaxis debe usar java para la comunicacin con la bd, y asi se asgura de que no haya errores con postgresql, ya que cada bd tiene su propia sintaxis
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.recovery.expiration-minutes=${RECOVERY_EXPIRATION_MINUTES:15}
app.recovery.frontend-url=${FRONTEND_URL:http://localhost:5173}





