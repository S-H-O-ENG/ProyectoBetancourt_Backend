spring.application.name=backend
#configuracion para conectarse a la bd
# linea 4 = es la direccion exacta de la bd, es la que hace la conexion de java y ls bd
spring.datasource.url=jdbc:postgresql://localhost:5433/taller_betancourt
spring.datasource.username=postgres
spring.datasource.password=mi_contrasena
spring.datasource.driver-class-name=org.postgresql.Driver
#configuracion para que JPA cree las tablas de la bd
# linea 13 = esta linea es para la creacion de las tablas en la bd, de forma intelginte, osea solo si no exite,y si ya existen no hace nada
spring.jpa.hibernate.ddl-auto=update
# linea 15 = es una herramienta para que java imprima en la consola todas las ordennes que le da a sql en tiempo real
spring.jpa.show-sql=true
# linea 16 = es la que determina que sintaxis debe usar java para la comunicacin con la bd, y asi se asgura de que no haya 
# errores con postgresql, ya que cada bd tiene su propia sintaxis
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect






